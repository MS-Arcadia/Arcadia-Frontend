name: PR validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-arcadia-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The three checks run in parallel rather than as one `pnpm check`, so a failure
  # says which of the three it was without reading a log.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      # Coverage runs with per-layer thresholds (see vitest.config.ts); the
      # job fails if any layer drops below its floor, so a PR that deletes
      # tests or adds untested branches is caught here rather than in review.
      - name: Run unit tests with coverage
        run: pnpm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_MODE: mock
          NEXT_PUBLIC_API_URL: /api

      - name: The route list has not changed by accident
        # `output: standalone` and the route manifest are what the Docker image
        # depends on, so this asserts the build produced both — a Next config
        # change that silently dropped standalone would otherwise only show up as
        # a broken image later.
        run: |
          test -f .next/standalone/server.js || {
            echo "no standalone server.js — is output: 'standalone' still set in next.config.ts?"
            exit 1
          }
          echo "standalone output present"

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: arcadia/frontend:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves the landing page
        # The same check the other Arcadia services make of their images: start it
        # and ask it something. A frontend that builds but does not boot is a
        # failure this catches before the image is pushed anywhere.
        run: |
          docker run -d --name frontend -p 3000:3000 arcadia/frontend:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf localhost:3000 >/dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:3000 | grep -qi "arcadia" || {
            echo "the landing page did not render"
            docker logs frontend
            exit 1
          }
          echo "landing page served"

      - name: A signed-out visitor reaches the landing page, not the store
        # The one routing invariant worth asserting in CI: `/` is public and the
        # store is not. It was the other way round until recently, and getting it
        # wrong means nobody can see the product without an account.
        run: |
          rc=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/store)
          [ "$rc" = "200" ] || { echo "GET /store answered $rc"; exit 1; }
          curl -sf localhost:3000 | grep -qi "create an account" || {
            echo "the landing page is not offering sign-up — is / still public?"
            exit 1
          }
          echo "/ is public and offers sign-up"
          docker rm -f frontend
