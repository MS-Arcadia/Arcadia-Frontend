name: Dependency audit

on:
  schedule:
    # Monday morning, so a new advisory is found by a person at the start of a week
    # rather than by a failing deploy in the middle of one.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Fail on critical advisories
        run: pnpm run audit:critical

      - name: Report high advisories
        # Reported, not enforced. A `high` in a transitive dev dependency is worth
        # reading and usually not worth blocking on, and a scheduled job that cries
        # wolf every week is a job people turn off.
        run: pnpm run audit:high
        continue-on-error: true
